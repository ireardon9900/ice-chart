function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();var m=document.getElementById('m');
  if(!(window.crypto&&crypto.subtle)){m.textContent='This browser can’t open it. Try Safari or Chrome.';return;}
  m.textContent='Opening…';
  try{
    var pw=new TextEncoder().encode(document.getElementById('p').value.trim().toLowerCase());
    var base=await crypto.subtle.importKey('raw',pw,'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},key,b64(D.c));
    var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(e){m.textContent='That passphrase didn’t work.';}
});
